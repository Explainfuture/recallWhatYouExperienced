name: Check and build Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check bundled MCP over stdio
        run: npx vitest run mcp/server.test.ts
        env:
          RECALL_MCP_TEST_SERVER: dist-mcp/server.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Recall-MCP
          path: dist-mcp/
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Recall-Windows-runtime
          path: |
            src-tauri/target/release/recall.exe
            src-tauri/target/release/mcp/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: Recall-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Recall-Cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
